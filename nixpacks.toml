[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo_sqlite",
    "php84Extensions.sqlite3",
    "php84Extensions.mbstring",
    "php84Extensions.tokenizer",
    "php84Extensions.xml",
    "php84Extensions.ctype",
    "php84Extensions.curl",
    "php84Extensions.fileinfo",
    "php84Extensions.openssl",
    "php84Extensions.bcmath"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=ProductSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"
